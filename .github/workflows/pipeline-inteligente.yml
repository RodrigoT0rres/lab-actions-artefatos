name: Pipeline Inteligente

on:
  # Regra 1: Execução manual pelo botão na interface do GitHub
  workflow_dispatch:

  # Regra 2: Agendamento diário às 02:00 da manhã (UTC)
  schedule:
    - cron: '0 2 * * *'

  # Regras 3 e 4: Push com filtros de branch e caminho
  push:
    # Regra 3: Só roda em branches que começam com "feature/"
    branches:
      - 'feature/**'
    # Regra 4: Monitora a pasta src/, mas IGNORA alterações em src/docs/
    paths:
      - 'src/**'
      - '!src/docs/**'

jobs:
  # ─────────────────────────────────────────
  # Job 1: Gera os artefatos (relatórios)
  # ─────────────────────────────────────────
  job_gerador:
    name: "Job Gerador - Produz os Relatórios"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Simular build e gerar relatórios
        run: |
          mkdir -p saida_build
          echo "Relatório 1 - Build concluído com sucesso em $(date)" > saida_build/relatorio1.txt
          echo "Relatório 2 - Nenhum erro encontrado na suite de testes" > saida_build/relatorio2.txt
          echo "Arquivos gerados:"
          ls -la saida_build/

      - name: Upload dos artefatos para o GitHub
        uses: actions/upload-artifact@v4
        with:
          name: meus-relatorios-oficiais
          path: saida_build/

  # ─────────────────────────────────────────
  # Job 2: Consome os artefatos gerados
  # ─────────────────────────────────────────
  job_auditoria:
    name: "Job Auditoria - Verifica os Relatórios"
    runs-on: ubuntu-latest
    needs: job_gerador  # Aguarda o job_gerador terminar antes de iniciar

    steps:
      - name: Download dos artefatos do GitHub
        uses: actions/download-artifact@v4
        with:
          name: meus-relatorios-oficiais

      - name: Listar arquivos baixados
        run: ls -R

      - name: Exibir conteúdo do relatorio1.txt
        run: cat relatorio1.txt
